name: Deploy Multi-Module Site to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: personal-website/package-lock.json

      - name: Setup mdBook
        uses: peaceiris/actions-mdbook@v2
        with:
          mdbook-version: '0.4.40'

      - name: Install Dependencies
        run: npm install --prefix personal-website

      - name: Build All JS/TS Modules
        run: npm run build:all --prefix personal-website

      - name: Consolidate Builds
        run: |
          mkdir -p final_site
          cp -r personal-website/landing/dist/* final_site/
          
          mkdir -p final_site/blog
          cp -r personal-website/blog/dist/* final_site/blog/
          
          mkdir -p final_site/analysis
          cp -r personal-website/analysis/docs/.vitepress/dist/* final_site/analysis/
          
          mkdir -p final_site/books
          cp -r personal-website/books/book/* final_site/books/

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./final_site
