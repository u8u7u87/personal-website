    <body class="sidebar-visible no-js">
    <div id="body-container">
        <!-- Provide site root to javascript -->
        <script>
            var path_to_root = "";
            var default_theme = window.matchMedia("(prefers-color-scheme: dark)").matches ? "navy" : "light";
        </script>

        <!-- Work around some values being stored in localStorage wrapped in quotes -->
        <script>
            try {
                var theme = localStorage.getItem('mdbook-theme');
                var sidebar = localStorage.getItem('mdbook-sidebar');

                if (theme.startsWith('"') && theme.endsWith('"')) {
                    localStorage.setItem('mdbook-theme', theme.slice(1, theme.length - 1));
                }

                if (sidebar.startsWith('"') && sidebar.endsWith('"')) {
                    localStorage.setItem('mdbook-sidebar', sidebar.slice(1, sidebar.length - 1));
                }
            } catch (e) { }
        </script>

        <!-- Set the theme before any content is loaded, prevents flash -->
        <script>
            var theme;
            try { theme = localStorage.getItem('mdbook-theme'); } catch(e) { }
            if (theme === null || theme === undefined) { theme = default_theme; }
            var html = document.querySelector('html');
            html.classList.remove('light')
            html.classList.add(theme);
            var body = document.querySelector('body');
            body.classList.remove('no-js')
            body.classList.add('js');
        </script>

        <input type="checkbox" id="sidebar-toggle-anchor" class="hidden">

        <!-- Hide / unhide sidebar before it is displayed -->
        <script>
            var body = document.querySelector('body');
            var sidebar = null;
            var sidebar_toggle = document.getElementById("sidebar-toggle-anchor");
            if (document.body.clientWidth >= 1080) {
                try { sidebar = localStorage.getItem('mdbook-sidebar'); } catch(e) { }
                sidebar = sidebar || 'visible';
            } else {
                sidebar = 'hidden';
            }
            sidebar_toggle.checked = sidebar === 'visible';
            body.classList.remove('sidebar-visible');
            body.classList.add("sidebar-" + sidebar);
        </script>

        <nav id="sidebar" class="sidebar" aria-label="Table of contents">
            <div class="sidebar-scrollbox">
                <ol class="chapter"><li class="chapter-item expanded "><a href="index.html" class="active"><strong aria-hidden="true">1.</strong> Introduction</a></li></ol>
            </div>
            <div id="sidebar-resize-handle" class="sidebar-resize-handle">
                <div class="sidebar-resize-indicator"></div>
            </div>
        </nav>

        <!-- Track and set sidebar scroll position -->
        <script>
            var sidebarScrollbox = document.querySelector('#sidebar .sidebar-scrollbox');
            sidebarScrollbox.addEventListener('click', function(e) {
                if (e.target.tagName === 'A') {
                    sessionStorage.setItem('sidebar-scroll', sidebarScrollbox.scrollTop);
                }
            }, { passive: true });
            var sidebarScrollTop = sessionStorage.getItem('sidebar-scroll');
            sessionStorage.removeItem('sidebar-scroll');
            if (sidebarScrollTop) {
                // preserve sidebar scroll position when navigating via links within sidebar
                sidebarScrollbox.scrollTop = sidebarScrollTop;
            } else {
                // scroll sidebar to current active section when navigating via "next/previous chapter" buttons
                var activeSection = document.querySelector('#sidebar .active');
                if (activeSection) {
                    activeSection.scrollIntoView({ block: 'center' });
                }
            }
        </script>

        <div id="page-wrapper" class="page-wrapper">

            <div class="page">
                <nav class="global-nav">
                    <a href="#" data-target="home">Home</a>
                    <a href="#" data-target="blog">Blog</a>
                    <a href="#" data-target="analysis">Analysis</a>
                    <a href="#" data-target="books" class="active">Books</a>
                </nav>

                <script>
                    document.addEventListener("DOMContentLoaded", function() {
                      const path = window.location.pathname;
                      const booksIndex = path.indexOf('/books/');
                      let rootPrefix = '/';
                      if (booksIndex !== -1) {
                        rootPrefix = path.substring(0, booksIndex + 1);
                      }
                      document.querySelectorAll('.global-nav a').forEach(a => {
                        const target = a.getAttribute('data-target');
                        if (target === 'home') a.href = rootPrefix;
                        if (target === 'blog') a.href = rootPrefix + 'blog/';
                        if (target === 'analysis') a.href = rootPrefix + 'analysis/';
                        if (target === 'books') a.href = rootPrefix + 'books/';
                      });
                    });
                </script>
                                <div id="menu-bar-hover-placeholder"></div>
                <div id="menu-bar" class="menu-bar sticky">
                    <div class="left-buttons">
                        <label id="sidebar-toggle" class="icon-button" for="sidebar-toggle-anchor" title="Toggle Table of Contents" aria-label="Toggle Table of Contents" aria-controls="sidebar">
                            <i class="fa fa-bars"></i>
                        </label>
                        <button id="theme-toggle" class="icon-button" type="button" title="Change theme" aria-label="Change theme" aria-haspopup="true" aria-expanded="false" aria-controls="theme-list">

                        </button>
                        <ul id="theme-list" class="theme-popup" aria-label="Themes" role="menu">

                            <li role="none"><button role="menuitem" class="theme" id="rust">Rust</button></li>
                            <li role="none"><button role="menuitem" class="theme" id="coal">Coal</button></li>
                            <li role="none"><button role="menuitem" class="theme" id="navy">Navy</button></li>
                            <li role="none"><button role="menuitem" class="theme" id="ayu">Ayu</button></li>
                        </ul>
                        <button id="search-toggle" class="icon-button" type="button" title="Search. (Shortkey: s)" aria-label="Toggle Searchbar" aria-expanded="false" aria-keyshortcuts="S" aria-controls="searchbar">
                            <i class="fa fa-search"></i>
                        </button>
                    </div>

                    <h1 class="menu-title">Books</h1>

                    <div class="right-buttons">
                        <a href="print.html" title="Print this book" aria-label="Print this book">
                            <i id="print-button" class="fa fa-print"></i>
                        </a>

                    </div>
                </div>

                <div id="search-wrapper" class="hidden">
                    <form id="searchbar-outer" class="searchbar-outer">
                        <input type="search" id="searchbar" name="searchbar" placeholder="Search this book ..." aria-controls="searchresults-outer" aria-describedby="searchresults-header">
                    </form>

                        <div id="searchresults-header" class="searchresults-header"></div>

                        </ul>

                <!-- Apply ARIA attributes after the sidebar and the sidebar toggle button are added to the DOM -->
                <script>
                    document.getElementById('sidebar-toggle').setAttribute('aria-expanded', sidebar === 'visible');
                    document.getElementById('sidebar').setAttribute('aria-hidden', sidebar !== 'visible');
                    Array.from(document.querySelectorAll('#sidebar a')).forEach(function(link) {
                        link.setAttribute('tabIndex', sidebar === 'visible' ? 0 : -1);
                    });
                </script>

                <div id="content" class="content">
                    <main>
                        <h1 id="introduction"><a class="header" href="#introduction">Introduction</a></h1>
<p>Welcome to my books module.</p>

                        <div id="giscus-container" style="margin-top: 50px;"></div>
                        <script>
                          (function() {
                            const htmlClass = document.documentElement.className;
                            const isDark = htmlClass.includes('coal') || htmlClass.includes('navy') || htmlClass.includes('ayu');
                            const giscusTheme = isDark ? 'dark' : 'light';

                            const script = document.createElement('script');
                            script.src = "https://giscus.app/client.js";
                            script.setAttribute('data-repo', 'username/personal-website');
                            script.setAttribute('data-repo-id', 'repo-id-placeholder');
                            script.setAttribute('data-category', 'Announcements');
                            script.setAttribute('data-category-id', 'category-id-placeholder');
                            script.setAttribute('data-mapping', 'pathname');
                            script.setAttribute('data-strict', '0');
                            script.setAttribute('data-reactions-enabled', '1');
                            script.setAttribute('data-emit-metadata', '0');
                            script.setAttribute('data-input-position', 'bottom');
                            script.setAttribute('data-theme', giscusTheme);
                            script.setAttribute('data-lang', 'zh-CN');
                            script.setAttribute('crossorigin', 'anonymous');
                            script.async = true;

                            document.getElementById('giscus-container').appendChild(script);

                            const observer = new MutationObserver(() => {
                              const currentClass = document.documentElement.className;
                              const currentDark = currentClass.includes('coal') || currentClass.includes('navy') || currentClass.includes('ayu');
                              const newTheme = currentDark ? 'dark' : 'light';
                              const iframe = document.querySelector('iframe.giscus-frame');
                              if (iframe) {
                                iframe.contentWindow.postMessage({
                                  giscus: {
                                    setConfig: {
                                      theme: newTheme
                                    }
                                  }
                                }, 'https://giscus.app');
                              }
                            });
                            observer.observe(document.documentElement, { attributes: true, attributeFilter: ['class'] });
                          })();
                        </script>
                    </main>

                        <!-- Mobile navigation buttons -->


                        <div style="clear: both"></div>
                    </nav>
